[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s2sr"
version = "1.0.0"
description = "Registration, harmonisation-gain compensation and training study for Sentinel-2 20 m super-resolution with SEN2NEON references"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.1", "numpy", "scipy", "pandas", "pyyaml", "h5py", "rasterio", "matplotlib", "tabulate",
                "huggingface_hub"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
